<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4E51'/%3E%3Cpath d='M16 44l10-12 8 7 14-17' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>SEO dashboard · JB Skincare and Skinolin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<style>
:root{--bg:#F3F5F6;--card:#FFFFFF;--ink:#13222A;--muted:#5C6C74;--faint:#8A989F;--line:#E1E7EA;--soft:#EEF2F4;
  --accent:#1F4E51;--tint:#E4F2EF;--good:#11704F;--goodbg:#E1F3EA;--bad:#AE2A1F;--badbg:#FBEAE8;--cmp:#B9C4CA;--cmpdark:#7D8B92;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}
/* lock */
.lock{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:#22312F;overflow:hidden}
.lbg{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.lbg figure{margin:0;position:relative;overflow:hidden;min-height:0}
.lbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.lbg .jb img{object-position:58% 28%}
.lbg figure::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(14,24,28,.28) 0%,rgba(14,24,28,.5) 100%)}
.lbg figcaption{position:absolute;bottom:20px;z-index:2;background:rgba(14,24,28,.72);color:#fff;font-weight:600;font-size:13px;letter-spacing:.04em;padding:7px 12px;border-radius:999px}
.lbg .sk figcaption{left:20px}.lbg .jb figcaption{right:20px}
.lockcard{position:relative;z-index:3;width:100%;max-width:440px;background:var(--card);border-radius:20px;padding:34px 30px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.hello{font-size:15px;font-weight:600;color:var(--muted);margin:18px 0 0!important}
.duo{display:flex;gap:6px;margin:0 0 22px}.duo i{width:26px;height:5px;border-radius:9px;display:block}
@media (max-width:700px){.lbg{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.lbg figcaption{bottom:12px}.lbg .sk figcaption{left:12px;bottom:auto;top:12px}.lbg .jb figcaption{right:12px}.lockcard{padding:28px 22px}}
.mark{font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--accent)}
.mark span{letter-spacing:0;font-weight:500;color:var(--muted);margin-left:8px;font-size:13px}
.lockcard h1{font-size:28px;line-height:1.2;margin:18px 0 10px}
.lockcard p{margin:0 0 22px;color:var(--muted)}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.inp{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,81,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--accent);color:#fff}
.btn.full{width:100%;margin-top:14px}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.err:empty{display:none}
.fine{font-size:12px;color:var(--faint);margin-top:16px}
/* top bar */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topin{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.top .mark{white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;margin-left:auto}
.tabs a{text-decoration:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs a.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,34,42,.12)}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;color:var(--muted);text-decoration:none}
.ghost:hover{color:var(--ink);border-color:#C9D3D8}
/* chooser */
.h1{font-size:30px;line-height:1.2;margin:36px 0 6px}
.lede{color:var(--muted);margin:0 0 24px;max-width:720px}
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.bcard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;border-top:5px solid var(--accent);transition:box-shadow .15s,transform .15s}
.bcard:hover{box-shadow:0 10px 30px rgba(19,34,42,.10);transform:translateY(-2px)}
.bname{font-size:24px;font-weight:700}
.bdom{color:var(--muted);font-size:14px;margin-bottom:18px}
.bstats{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;background:var(--tint);border-radius:12px}
.bstats .v{font-size:26px;font-weight:700;line-height:1.2}
.bsince{margin-top:12px;font-size:14px;color:var(--muted)}
.bsince b{color:var(--ink)}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.go{color:var(--accent);font-weight:600}
.note{color:var(--faint);font-size:13px;margin:22px 0 40px}
/* dashboard */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:30px 0 14px}
.head h1{font-size:32px;line-height:1.15;margin:0}
.head .sub{color:var(--muted);margin-top:6px}
.head .sub a{color:var(--accent);text-decoration:none;font-weight:500}
.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl .k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-align:left;line-height:1.25}
.seg button small{display:block;font-weight:500;color:var(--faint);font-size:11.5px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,34,42,.12)}
.seg button[aria-pressed=true] small{color:var(--muted)}
.fixed{background:var(--soft);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;line-height:1.25}
.fixed small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.olap{flex-basis:100%;font-size:13px;color:var(--muted);background:#FFF8E8;border:1px solid #F3E3B5;border-radius:10px;padding:8px 12px}
.olap a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.insight{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.insight h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.insight ul{margin:0;padding-left:18px}
.insight li{margin:4px 0}
.insight b{font-weight:700}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{font-size:13px;font-weight:600;color:var(--muted)}
.vrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.kpi.small .v{font-size:24px}
.spark{width:104px;height:34px;flex:none;overflow:visible}
.kpi .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi .was{font-size:13px;color:var(--faint)}
.kpi .help{font-size:12.5px;color:var(--faint);line-height:1.4}
.sparknote{font-size:12px;color:var(--faint);margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--accent)}
.key i.c{border-top:2px dashed var(--cmpdark)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--goodbg);color:var(--good)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.flat{background:var(--soft);color:var(--muted)}
.chip:empty{display:none}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:18px}
.sech{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sech h2{font-size:19px;margin:0 0 4px;line-height:1.3}
.sech p{margin:0;color:var(--muted);font-size:14px;max-width:700px}
.tog{display:flex;gap:8px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:center}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.chartbox{position:relative;height:290px}
.chartbox.tall{height:310px}
.chartbox.short{height:200px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);background:#F8FAFB;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.kw{font-weight:600;min-width:180px}
td.pg{color:var(--muted);min-width:160px}
td.url{min-width:220px;word-break:break-word}
td.url a,td.pn a{text-decoration:none;color:var(--ink)}
td.url a:hover,td.pn a:hover{color:var(--accent);text-decoration:underline}
td.pn{min-width:240px}
td.pn .s{display:block;font-size:12px;color:var(--faint);margin-top:2px}
td.tk{min-width:150px;color:var(--muted)}
td.tk b{color:var(--ink);font-weight:600}
tr.tot td{font-weight:700;background:#F8FAFB}
.low{color:var(--faint);font-style:italic}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.pill b{display:block;font-size:20px;color:var(--ink);line-height:1.2}
.pill.good b{color:var(--good)}
.pill.bad b{color:var(--bad)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools .inp{max-width:300px;padding:9px 12px}
.sel{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.more{margin-top:12px}
.tag{font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.st{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.st.live{background:var(--goodbg);color:var(--good)}
.st.wait{background:#FFF3D6;color:#8A5A00}
.st.plan{background:var(--soft);color:var(--muted)}
.cardnote{font-size:12.5px;color:var(--faint);margin-top:12px}
.sm{display:none}
.sig{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}
.sig .pill b{font-size:18px}
.sig .pill small{display:block;font-size:12px;color:var(--faint)}
@media (max-width:900px){.sig{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* since our call */
.since{border-top:5px solid var(--accent)}
.sec,.controls{scroll-margin-top:76px}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
td small,.cellsub{display:block;font-size:12px;color:var(--faint);font-weight:500;white-space:nowrap}
.work{list-style:none;margin:0;padding:0}
.work li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.work li:last-child{border-bottom:0}
.work .d{font-size:12.5px;font-weight:600;color:var(--accent);padding-top:1px;white-space:nowrap}
.pub{list-style:none;margin:0;padding:0}
.pub li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pub li:last-child{border-bottom:0}
.pub a{text-decoration:none;font-weight:600}.pub a:hover{color:var(--accent);text-decoration:underline}
.pub .d{display:block;font-size:12px;color:var(--faint)}
details.nx{margin-top:10px;font-size:14px}details.nx summary{cursor:pointer;color:var(--accent);font-weight:600}
h3.sub{font-size:15px;margin:22px 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
/* month by month ranking bars (as on Maria's dashboard) */
.mchart{position:relative}
.mchart svg{width:100%;height:auto;display:block;overflow:visible}
.mchart text{font-size:12px;fill:var(--muted);font-family:inherit}
.mchart text.val{font-weight:700;fill:var(--ink)}
.mchart .tip{position:absolute;pointer-events:none;background:#13222A;color:#fff;font-size:12.5px;line-height:1.5;padding:8px 10px;border-radius:8px;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;white-space:nowrap;z-index:2}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend2 span{display:inline-flex;align-items:center;gap:6px}.legend2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.kxtabs{margin-bottom:10px}
.kxexpl{font-size:13.5px;color:var(--muted);margin:0 0 12px}
td.pgl{color:var(--muted);font-size:13px;word-break:break-word;min-width:160px}
td.pgl a{text-decoration:none}td.pgl a:hover{color:var(--accent);text-decoration:underline}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.jump button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.jump button:hover{color:var(--ink);border-color:#C9D3D8}
.jump button.hot{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:900px){.wl,.cols{grid-template-columns:1fr}}
@media (max-width:560px){table.wt{table-layout:fixed}table.wt th:nth-child(1){width:44%}table.wt th:nth-child(2){width:30%}table.wt th:nth-child(4){width:26%}
  table.wt small{white-space:normal}
  table.kx{table-layout:fixed}table.kx th:nth-child(1){width:37%}table.kx th:nth-child(2){width:14%}table.kx th:nth-child(3){width:17%}table.kx th:nth-child(4){width:14%}table.kx th:nth-child(5){width:18%}td.pgl{display:none}th.pgl{display:none}.work li{grid-template-columns:52px 1fr}}
/* visual since-call layout */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 6px}
.hhead .h1{margin:0}
.upd{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.kick{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:16px 0 12px}
.rngc{font-size:13px;color:var(--faint)}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.h2c{font-size:20px;margin:30px 0 4px}
.hcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hcard header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hcard .bdom{margin:0}
.btn.sm{padding:8px 14px;font-size:14px;text-decoration:none;white-space:nowrap}
.tiles{display:grid;gap:10px}
.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.t6{grid-template-columns:repeat(6,minmax(0,1fr))}
.tile{background:var(--soft);border-radius:12px;padding:12px;min-width:0}
.since .tile{background:var(--card);border:1px solid var(--line)}
.tile .k{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:24px;font-weight:700;line-height:1.15;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--faint);font-weight:600}
.tile .ts{font-size:11.5px;color:var(--faint);margin-top:4px}
.tile .bar{margin-top:8px;background:#E3E9EC}
.mini{height:110px;position:relative}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.movers h4{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.up{color:var(--good)!important}.down{color:var(--bad)!important}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.mv .q{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .pp{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.hfoot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid var(--line);padding-top:12px}
.hfoot .k{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hfoot .v{font-size:17px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vs{font-weight:500;color:var(--faint);font-size:15px}
.pillnote{font-size:12px;color:#8A5A00;background:#FFF3D6;border-radius:999px;padding:4px 10px;white-space:nowrap}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px;margin-top:14px}
.alert{display:flex;align-items:center;gap:12px;border-radius:12px;padding:10px 14px;border:1px solid;min-width:0}
.alert.drop{background:var(--badbg);border-color:#F2CFCB}.alert.rise{background:var(--goodbg);border-color:#C6E8D6}
.alert .ai{font-weight:700;font-size:14px}.alert.drop .ai{color:var(--bad)}.alert.rise .ai{color:var(--good)}
.alert .at{flex:1;min-width:0}.alert .at b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13.5px;line-height:1.3;overflow:hidden}.alert .at small{font-size:12.5px;color:var(--muted)}
.spk{flex:none;display:inline-block;vertical-align:middle}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h3{font-size:14px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel .hs{font-size:12px;font-weight:500;color:var(--faint)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.ph h3{margin:0}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chartbox.donut{height:220px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 14px}
.tl li::before{content:"";position:absolute;left:-21px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--accent)}
.tl .d{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.tl b{display:block;font-size:14px}.tl small{font-size:12.5px;color:var(--faint)}
.pub .d{display:inline;margin-left:8px}
@media (max-width:900px){.t6{grid-template-columns:repeat(3,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}}
@media (max-width:560px){.t4,.t6{grid-template-columns:repeat(2,minmax(0,1fr))}.movers{grid-template-columns:1fr}.tile .v{font-size:20px}.hfoot .v{font-size:15px}
  .alerts{grid-template-columns:1fr}.alert .spk{width:90px}.homegrid{grid-template-columns:1fr}}
.foot{color:var(--faint);font-size:12.5px;margin:26px 0 40px;line-height:1.6}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.split,.split.even{grid-template-columns:1fr}}
@media (max-width:560px){.wrap{padding:0 16px}.head h1{font-size:26px}.h1{font-size:25px}.kpi{padding:14px}.kpi .v{font-size:23px}.kpi.small .v{font-size:20px}.sec{padding:16px}
  .spark{width:72px;height:26px}.vrow{flex-wrap:wrap}.insight{padding:14px 16px}
  .top{position:static}.topin{padding:10px 16px;gap:8px}.top .mark{flex:1}.top .mark span{display:none}
  .tabs{order:3;margin-left:0;width:100%}.tabs a{flex:1;text-align:center}.ghost{padding:6px 10px;font-size:13px}

  table.pt th:nth-child(1){width:44%}table.pt th:nth-child(2){width:16%}table.pt th:nth-child(3){width:24%}table.pt th:nth-child(5){width:16%}
  table.kt th:nth-child(1){width:38%}table.kt th:nth-child(4){width:19%}table.kt th:nth-child(5){width:19%}table.kt th:nth-child(6){width:24%}
  table.pl th:nth-child(1){width:46%}table.pl th:nth-child(4){width:24%}table.pl th:nth-child(5){width:30%}
  table.rk td:first-child{min-width:92px}
  table.qt{table-layout:fixed}table.qt th:nth-child(1){width:42%}table.qt th:nth-child(2){width:15%}table.qt th:nth-child(4){width:17%}table.qt th:nth-child(5){width:26%}}
</style>

<body>
<noscript><p style="padding:24px">This dashboard needs JavaScript.</p></noscript>

<section id="lock" class="lock" hidden>
  <div class="lbg" aria-hidden="true">
    <figure class="sk"><img src="login-skinolin.webp" alt="" fetchpriority="high"><figcaption>Skinolin</figcaption></figure>
    <figure class="jb"><img src="login-jb.webp" alt=""><figcaption>JB Skincare</figcaption></figure>
  </div>
  <form class="lockcard" id="lockform" autocomplete="on">
    <div class="mark">LOCKNCODE<span>SEO dashboard</span></div>
    <h1>JB Skincare and Skinolin</h1>
    <div class="duo" aria-hidden="true"><i style="background:#15968C"></i><i style="background:#99632C"></i></div>
    <label class="f" for="pw">Password</label>
    <input class="inp" id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required autofocus>
    <button class="btn full" id="unlockbtn" type="submit">Open dashboard</button>
    <div class="err" id="lockerr" role="alert"></div>
  </form>
</section>
<div id="choose" hidden></div>
<div id="dash" hidden></div>

<script>
(() => {
'use strict';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nf = new Intl.NumberFormat('en-IN');
const PIDS = ['7', '14', '28', '90', 'since'];
const PSHORT = {'7':'7 days', '14':'14 days', '28':'28 days', '90':'3 months', 'since':'Since we started'};
const PNOW = {'7':'Last 7 days', '14':'Last 14 days', '28':'Last 28 days', '90':'Last 3 months', 'since':'Since we started'};
const PPHRASE = {'7':'the last 7 days', '14':'the last 14 days', '28':'the last 28 days', '90':'the last 3 months', 'since':'the weeks since we started on 1 Sep'};
const PREV = {'7':'Previous 7 days', '14':'Previous 14 days', '28':'Previous 28 days', '90':'Previous 3 months'};
const S = {data:null, brand:null, period:'28', cmp:'previous', rank:'all', tg:'type', tmx:'c', kwq:'', kwb:'all', kwsort:'now', kwall:false,
  pf:'live', ps:'views', tm:'c', lm:'c', tq:'all', sm:'c', wl:'q', mb:'all', mm:'clicks', kv:'c', kn:15, charts:{}};
const store = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}, del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };

// ---------- data ----------
let ENC = null;
async function loadEnc(){ if (!ENC){ const r = await fetch('data.enc.json', {cache:'no-store'}); if (!r.ok) throw new Error('load'); ENC = await r.json(); } return ENC; }
async function decrypt(pw){
  const e = await loadEnc();
  const p = e.norm === 'trim+lower' ? pw.trim().toLowerCase() : pw;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:e.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  let pt;
  try { pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.ct)); } catch (x) { throw new Error('password'); }
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---------- formatting ----------
const P = iso => { const [y,m,d] = iso.split('-').map(Number); return {y,m,d}; };
const dm = iso => { const p = P(iso); return `${p.d} ${MON[p.m-1]}`; };
const rng = (a,b) => { const A = P(a), B = P(b); return A.y === B.y ? `${dm(a)} to ${dm(b)} ${B.y}` : `${dm(a)} ${A.y} to ${dm(b)} ${B.y}`; };
const N = x => nf.format(x);
const dayNum = iso => { const [y,m,d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const isoOf = n => new Date(n * 864e5).toISOString().slice(0, 10);
const overlapDays = (r1, r2) => Math.max(0, Math.min(dayNum(r1[1]), dayNum(r2[1])) - Math.max(dayNum(r1[0]), dayNum(r2[0])) + 1);
function dCount(now, was){
  if (was == null) return {t:'', c:'flat'};
  if (!was) return now > 0 ? {t:'New', c:'good'} : {t:'No change', c:'flat'};
  const p = (now / was - 1) * 100;
  if (Math.abs(p) < 0.5) return {t:'No change', c:'flat'};
  return {t:`${p > 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(0)}%`, c: p > 0 ? 'good' : 'bad'};
}
function dPts(now, was){ const x = now - was; if (Math.abs(x) < 0.05) return {t:'No change', c:'flat'}; return {t:`${x > 0 ? '▲' : '▼'} ${Math.abs(x).toFixed(1)} points`, c: x > 0 ? 'good' : 'bad'}; }
function dPos(now, was, words){
  if (now == null || was == null) return {t:'', c:'flat'};
  const x = was - now;
  if (Math.abs(x) < 0.05) return {t:'No change', c:'flat'};
  return {t:`${x > 0 ? '▲' : '▼'} ${Math.abs(x).toFixed(1)}${words ? (x > 0 ? ' places higher' : ' places lower') : ''}`, c: x > 0 ? 'good' : 'bad'};
}
const H = (lg, sm) => `<span class="lg">${lg}</span><span class="sm">${sm}</span>`;
const chip = d => `<span class="chip ${d.c}">${d.t}</span>`;
function bandOf(p){ const r = Math.floor(p + 0.5); return r <= 3 ? 0 : r <= 10 ? 1 : r <= 20 ? 2 : r <= 50 ? 3 : 4; }
const per = b => b.periods[S.period];
const role = () => S.period === 'since' ? 'start' : S.cmp;
const nowName = () => PNOW[S.period];
function cmpName(b){ const p = per(b); return S.period === 'since' ? `The ${p.days} days before` : S.cmp === 'previous' ? PREV[S.period] : 'Before we started'; }
function cmpPhrase(b){ const p = per(b); return S.period === 'since' || S.cmp === 'start' ? `the ${p.days} days before we started` : `the ${PREV[S.period].toLowerCase().replace('previous ', '')} before`; }
function changeWords(now, was, unit){
  if (!was) return now ? 'new this period' : 'no change';
  const p = (now / was - 1) * 100;
  if (Math.abs(p) < 3) return `about the same as ${unit}`;
  return `${p > 0 ? 'up' : 'down'} ${Math.abs(p).toFixed(0)}% on ${unit}`;
}

// ---------- day-level series: every chart is cut from the chosen period ----------
function bucketsFor(range){
  const n = dayNum(range[1]) - dayNum(range[0]) + 1, step = n <= 35 ? 1 : 7, out = [];
  for (let s = 0; s < n; s += step) out.push([isoOf(dayNum(range[0]) + s), isoOf(dayNum(range[0]) + Math.min(s + step, n) - 1)]);
  return {step, buckets: out};
}
function seriesFor(b, range, m){
  const D = b.days, idx = {};
  D.d.forEach((d, i) => idx[d] = i);
  return bucketsFor(range).buckets.map(([a, z]) => {
    const i0 = idx[a], i1 = idx[z];
    if (i0 == null || i1 == null) return null;
    let c = 0, im = 0, pw = 0, pi = 0, nbc = 0, nbi = 0, q = 0, n = 0;
    for (let i = i0; i <= i1; i++) {
      c += D.c[i]; im += D.i[i]; nbc += D.nbc[i]; nbi += D.nbi[i]; q += D.q[i]; n++;
      if (D.p[i] != null && D.i[i]) { pw += D.p[i] * D.i[i]; pi += D.i[i]; }
    }
    if (m === 'c') return c; if (m === 'i') return im; if (m === 'nbc') return nbc; if (m === 'nbi') return nbi;
    if (m === 'ctr') return im ? c / im * 100 : null; if (m === 'pos') return pi ? pw / pi : null; if (m === 'q') return n ? q / n : null;
    return null;
  });
}
function spark(cur, cmp, color, invert){
  const all = cur.concat(cmp).filter(x => x != null);
  if (cur.filter(x => x != null).length < 2) return '';
  const lo = Math.min(...all), hi = Math.max(...all), W = 104, Hh = 34, pad = 3;
  const y = x => { const t = hi === lo ? 0.5 : (x - lo) / (hi - lo); return pad + (invert ? t : 1 - t) * (Hh - 2 * pad); };
  const path = v => { const pts = v.map((x, i) => x == null ? null : [(i / Math.max(1, v.length - 1)) * (W - 2 * pad) + pad, y(x)]).filter(Boolean);
    return {d: pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' '), last: pts[pts.length - 1]}; };
  const a = path(cur), c = cmp.filter(x => x != null).length > 1 ? path(cmp) : null;
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Trend in this period"><title>This period (solid) against the comparison (dashed)</title>
    ${c ? `<path d="${c.d}" fill="none" stroke="#9AA7AE" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ''}
    <path d="${a.d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${a.last[0].toFixed(1)}" cy="${a.last[1].toFixed(1)}" r="2.6" fill="${color}"/></svg>`;
}

// ---------- screens ----------
function show(id){ for (const s of ['lock','choose','dash']) $('#' + s).hidden = s !== id; window.scrollTo(0, 0); }
function topbar(active){
  const tabs = S.data.brands.map(b => `<a href="#${b.id}" class="${b.id === active ? 'on' : ''}">${esc(b.name)}</a>`).join('');
  return `<header class="top"><div class="wrap topin"><div class="mark">LOCKNCODE<span>SEO dashboard</span></div>
    ${active ? `<nav class="tabs" aria-label="Brand">${tabs}</nav><a class="ghost" href="#">All brands</a>` : '<span style="margin-left:auto"></span>'}
    <button class="ghost" data-act="lock" type="button">Lock</button></div></header>`;
}
function renderChoose(){
  const d = S.data;
  document.documentElement.style.setProperty('--accent', '#1F4E51'); document.documentElement.style.setProperty('--tint', '#E4F2EF');
  const sc = d.brands[0].since;
  $('#choose').innerHTML = topbar(null) + `<main class="wrap">
    <div class="hhead"><h1 class="h1">${greet()}, JB Skincare and Skinolin</h1><span class="upd">Updated ${esc(d.updated)}</span></div>
    ${sc ? `<div class="kick"><span class="eyebrow">Since our call · ${dm(sc.call)}</span><span class="rngc">${rng(sc.from, sc.to)} vs ${rng(sc.pfrom, sc.pto)}</span></div>
    <div class="homegrid">${d.brands.map(homeCard).join('')}</div>` : ''}
    <h2 class="h2c">Choose a brand</h2>
    <p class="lede">How each site is doing in Google Search. The cards show the last 28 days against the 28 days before.</p>
    <div class="brands">${d.brands.map(b => { const p = b.periods['28'], L = b.win[p.latest], V = b.win[p.previous], s = b.periods.since, SL = b.win[s.latest], SB = b.win[s.start];
      const live = b.plan.filter(i => i.live).length; return `
      <a class="bcard" href="#${b.id}" style="--accent:${b.accent};--tint:${b.tint}">
        <div class="bname">${esc(b.name)}</div><div class="bdom">${esc(b.domain)}</div>
        <div class="bstats"><div><div class="muted" style="font-size:13px">Clicks from Google</div><div class="v">${N(L.clicks)}</div>${chip(dCount(L.clicks, V.clicks))}</div>
        <div><div class="muted" style="font-size:13px">Views in Google</div><div class="v">${N(L.impr)}</div>${chip(dCount(L.impr, V.impr))}</div></div>
        <div class="bsince">Since we started on 1 Sep: <b>${N(SL.clicks)} clicks</b> against ${N(SB.clicks)} in the ${s.days} days before ${chip(dCount(SL.clicks, SB.clicks))}</div>
        <div class="bfoot"><span>October plan: ${live} of ${b.plan.length} live</span><span class="go">Open dashboard →</span></div></a>`; }).join('')}</div>
    <p class="note">Last 28 days: ${rng(...d.brands[0].win[d.brands[0].periods['28'].latest].range)}. Google publishes Search Console data two to three days late.</p></main>`;
  show('choose');
  drawHome();
}
// ---------- since our call (fixed window, Google's newest data) ----------
const tile = (k, v, ch, sub, meter) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${ch || ''}${meter != null ? `<div class="bar"><i style="width:${Math.max(0, Math.min(100, meter))}%"></i></div>` : ''}${sub ? `<div class="ts">${sub}</div>` : ''}</div>`;
function whyChip(r){
  if (r.pp == null) return chip({t:'New', c:'good'});
  if (r.p == null) return chip({t:'Gone', c:'bad'});
  const dc = r.c - r.pc;
  if (dc) return chip({t:`${dc > 0 ? '+' : '-'}${Math.abs(dc)} click${Math.abs(dc) === 1 ? '' : 's'}`, c: dc > 0 ? 'good' : 'bad'});
  return chip(dPos(r.p, r.pp));
}
const pageName = path => { const seg = dec(path).split('?')[0].split('/').filter(Boolean); if (!seg.length) return 'Homepage'; let x = seg[seg.length - 1]; if (/^\d{10,}$/.test(x) && seg.length > 1) x = seg[seg.length - 2]; x = x.replace(/[-_]+/g, ' '); return x.charAt(0).toUpperCase() + x.slice(1); };
const posTxt = r => r.pp == null ? `new at ${r.p.toFixed(1)}` : r.p == null ? `was ${r.pp.toFixed(1)}` : `${r.pp.toFixed(1)} → ${r.p.toFixed(1)}`;
function moverRow(r){ return `<div class="mv"><span class="q" title="${esc(r.q)}">${esc(r.q)}</span><span class="pp">${posTxt(r)}</span>${whyChip(r)}</div>`; }
// sparkline: gray before the call, brand color after it
function spk(vals, split, color, w = 120, h = 30){
  const hi = Math.max(...vals, 1), n = vals.length, x = i => 2 + i / Math.max(1, n - 1) * (w - 4), y = v => h - 3 - v / hi * (h - 6);
  const line = (a, b) => vals.slice(a, b).map((v, k) => `${k ? 'L' : 'M'}${x(a + k).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${line(0, split + 1)}" fill="none" stroke="#9AA7AE" stroke-width="1.6"/><path d="${line(split, n)}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
}
function homeCard(b){
  const s = b.since;
  if (!s) return '';
  const pub = s.published, ix = s.index;
  return `<article class="hcard" style="--accent:${b.accent};--tint:${b.tint}">
    <header><div><div class="bname">${esc(b.name)}</div><div class="bdom">${esc(b.domain)}</div></div><a class="btn sm" href="#${b.id}">Open dashboard</a></header>
    <div class="tiles t4">
      ${tile('Clicks', N(s.now.c), chip(dCount(s.now.c, s.before.c)), `was ${N(s.before.c)}`)}
      ${tile('Views', N(s.now.i), chip(dCount(s.now.i, s.before.i)), `was ${N(s.before.i)}`)}
      ${ix && ix.now ? tile('Indexed', `${ix.now[0]}<small>/${ix.now[1]}</small>`, ix.then ? chip({t:`+${ix.now[0] - ix.then[0]}`, c:'good'}) : '', null, ix.now[0] / ix.now[1] * 100) : ''}
      ${tile('New articles', pub.live.length, '', `+${pub.next.length} scheduled`, pub.live.length / Math.max(1, pub.live.length + pub.next.length) * 100)}
    </div>
    <div class="mini"><canvas id="mini-${b.id}" aria-label="Clicks per day around the call"></canvas></div>
    <div class="movers"><div><h4 class="up">▲ Up</h4>${s.win.slice(0, 3).map(moverRow).join('') || '<div class="mv muted">None yet</div>'}</div>
      <div><h4 class="down">▼ Down</h4>${s.lose.slice(0, 3).map(moverRow).join('') || '<div class="mv muted">None</div>'}</div></div>
  </article>`;
}
function sinceHtml(b){
  const s = b.since; if (!s) return '';
  const pub = s.published, ix = s.index, nb1 = s.bands[0][0] + s.bands[0][1], wb1 = s.bands[1][0] + s.bands[1][1];
  const ci = s.days.d.indexOf(s.call), fresh = s.days.fresh_from <= s.to, ac = b.accent;
  const wlRows = rows => S.wl === 'q'
    ? rows.slice(0, 8).map(r => `<tr><td class="kw">${esc(r.q)}${r.brand ? '<span class="tag">brand</span>' : ''}</td><td class="n">${posTxt(r)}</td><td class="n hp">${N(r.pv)} → ${N(r.v)}</td><td class="n">${whyChip(r)}</td></tr>`).join('')
    : rows.slice(0, 8).map(r => `<tr><td class="url"><a href="${esc(r.u)}" target="_blank" rel="noopener" title="${esc(dec(r.path))}">${esc(pageName(r.path))}</a></td><td class="n hp">${r.sp ? spk(r.sp, ci, ac, 90, 26) : ''}</td><td class="n">${N(r.pv)} → ${N(r.v)}</td><td class="n">${chip(r.c !== r.pc ? {t:`${r.c - r.pc > 0 ? '+' : '-'}${Math.abs(r.c - r.pc)} clicks`, c:r.c > r.pc ? 'good' : 'bad'} : dCount(r.v, r.pv))}</td></tr>`).join('');
  const wlHead = S.wl === 'q' ? '<thead><tr><th>Search</th><th class="n" title="Average position in Google, 1 is the top">Position</th><th class="n hp">Views</th><th class="n"></th></tr></thead>'
    : '<thead><tr><th>Page</th><th class="n hp">Views a day</th><th class="n">Views</th><th class="n"></th></tr></thead>';
  const W = S.wl === 'q' ? s.win : s.pages_up, Lo = S.wl === 'q' ? s.lose : s.pages_down, cl = s.clarity;
  return `<section class="sec since" id="s-since">
    <div class="sech" style="margin-bottom:12px"><div><div class="eyebrow">Since our call · ${dm(s.call)}</div><h2>${rng(s.from, s.to)} <span class="vs">vs ${rng(s.pfrom, s.pto)}</span></h2></div>
      ${fresh ? `<span class="pillnote">From ${dm(s.days.fresh_from)}: early figures</span>` : ''}</div>
    <div class="tiles t6">
      ${tile('Clicks', N(s.now.c), chip(dCount(s.now.c, s.before.c)), `was ${N(s.before.c)}`)}
      ${tile('Views', N(s.now.i), chip(dCount(s.now.i, s.before.i)), `was ${N(s.before.i)}`)}
      ${tile('Views, no brand', N(s.now.nbi), chip(dCount(s.now.nbi, s.before.nbi)), `was ${N(s.before.nbi)}`)}

    <div class="sig">${SIG.map(([k, l, h]) => { const v = A.sig[k] || 0; return `<div class="pill${v ? ' bad' : ' good'}" title="${h}"><b>${N(v)}</b>${l}<small>${h}; ${sh(v, A.sessions)} of visits</small></div>`; }).join('')}</div>
    ${b.clarity.length > 1 ? '<div class="chartbox short"><canvas id="chClarity" aria-label="Visits each day"></canvas></div>' : `<div class="cardnote" style="margin:0 0 14px">Clarity is checked once a day from ${dm(w.to.slice(0, 10))}, so a day by day chart appears here after the next check.</div>`}
    <div class="split even" style="margin-top:14px;align-items:start"><div class="tw">${tbl('Where visitors came from', A.source, A.sessions)}</div><div class="tw">${tbl('Device', A.device, A.sessions)}</div></div>
    <h3 style="font-size:15px;margin:20px 0 8px">Pages people visited most</h3>
    <div class="tw"><table class="pt"><thead><tr><th>Page</th><th class="n">Visits</th><th class="n">${H('Scrolled', 'Scroll')}</th><th class="n hp">Active time</th><th class="n">${H('Problems', 'Issues')}</th></tr></thead><tbody>${pages.map(g => {
      const pr = [g.qb ? `${g.qb} quick back${g.qb > 1 ? 's' : ''}` : '', g.se ? `${g.se} page error${g.se > 1 ? 's' : ''}` : '', g.fr ? `${g.fr} rage or dead click${g.fr > 1 ? 's' : ''}` : ''].filter(Boolean).join(', ');
      return `<tr><td class="url"><a href="https://${esc(b.domain)}${esc(g.path)}" target="_blank" rel="noopener">${esc(dec(g.path))}</a></td><td class="n">${N(g.s)}</td><td class="n">${g.sn ? Math.round(g.sw / g.sn) + '%' : 'n/a'}</td><td class="n hp">${secs(g.an ? g.aw / g.an : null)}</td><td class="n">${pr ? `<span class="chip bad" style="white-space:normal">${pr}</span>` : '<span class="muted">none</span>'}</td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">No visits yet.</td></tr>'}</tbody></table></div>
    <div class="cardnote">A visit counts on every page it opened, so one visit can count on more than one page. Links carrying Google's tracking code are counted with the page itself.</div>`;
}
const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
function renderPages(b){

    p.pages.map(x => { const n = x.v.latest, w = x.v[r];

function renderQueries(b){

// ---------- charts ----------
function chartReady(fn){ if (window.Chart) { fn(); return true; } if (document.readyState !== 'complete') window.addEventListener('load', () => window.Chart && fn(), {once:true}); return false; }

        options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, startMark:{index:ci - .5, label:'Call', color:'#13222A'}, tooltip:{callbacks:{label:c => ` ${N(c.raw)} clicks`}}},
          scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:5, font:{size:10}}}, y:{beginAtZero:true, grid:{color:'#EEF2F4'}, ticks:{precision:0, maxTicksLimit:3, font:{size:10}}}}},
        plugins:[markerPlugin]}); } });
}
const markerPlugin = {id:'startMark', afterDatasetsDraw(ch, args, o){
  if (o == null || o.index == null || o.index < 0) return;
  const i0 = Math.floor(o.index), fr = o.index - i0, x0 = ch.scales.x.getPixelForValue(i0), x = fr ? x0 + (ch.scales.x.getPixelForValue(i0 + 1) - x0) * fr : x0, {top, bottom} = ch.chartArea, c = ch.ctx;
  c.save(); c.strokeStyle = o.color; c.setLineDash([5, 4]); c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, top + 14); c.lineTo(x, bottom); c.stroke();
  c.setLineDash([]); c.fillStyle = o.color; c.font = '600 12px Inter, system-ui, sans-serif'; c.textAlign = x > ch.chartArea.right - 110 ? 'right' : 'left';
  c.fillText(o.label, x + (c.textAlign === 'left' ? 6 : -6), top + 10); c.restore(); }};
function drawCharts(b){
  for (const k in S.charts) { S.charts[k].destroy(); delete S.charts[k]; }
  if (!window.Chart && document.readyState !== 'complete'){ window.addEventListener('load', () => { if (S.brand === b.id) drawCharts(b); }, {once:true}); return; }
  if (!window.Chart){ for (const id of ['chSince','chTypes','chSrc','chArt','chTrend','chClarity','chTraffic','chRank','chLong','chLinks']) { const el = $('#' + id); if (el) el.parentElement.innerHTML = '<p class="muted">The chart could not load. The tables still show every number.</p>'; } return; }
  const accent = b.accent, cmp = '#B9C4CA', cmpDark = '#7D8B92', grid = '#E9EEF0', ink = '#13222A', p = per(b), Lr = b.win[p.latest].range, Cr = b.win[p[role()]].range;
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif'; Chart.defaults.color = '#5C6C74';
  Chart.defaults.animation.duration = 350; Chart.defaults.animations.x = false;   // switching periods should feel instant, and lines grow upward, not sideways
  const legend = {position:'bottom', labels:{boxWidth:12, boxHeight:12, usePointStyle:true, pointStyle:'rectRounded'}};
  // 1. trend: chosen period against the comparison, bucket by bucket
  const bk = bucketsFor(Lr), cbk = bucketsFor(Cr), tm = S.tm, unit = {c:'clicks', i:'views', nbc:'clicks without the brand name', nbi:'views without the brand name'}[tm];
  const cur = seriesFor(b, Lr, tm), was = seriesFor(b, Cr, tm), lab = bk.buckets.map(([a, z]) => bk.step === 1 ? dm(a) : `${dm(a)}`);
  S.charts.trend = new Chart($('#chTrend'), {type:'line', data:{labels:lab, datasets:[
      {label:nowName(), data:cur, borderColor:accent, backgroundColor:accent + '22', fill:true, tension:.3, pointRadius:bk.step === 1 && cur.length > 20 ? 2 : 3, pointBackgroundColor:accent, borderWidth:2.5},
      {label:cmpName(b), data:was, borderColor:cmpDark, borderDash:[6, 5], fill:false, tension:.3, pointRadius:0, borderWidth:2}]},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false}, plugins:{legend,
      tooltip:{callbacks:{title:c => { const i = c[0].dataIndex, a = bk.buckets[i], z = cbk.buckets[i]; return `${bk.step === 1 ? dm(a[0]) : rng(a[0], a[1])}  vs  ${z ? (bk.step === 1 ? dm(z[0]) : rng(z[0], z[1])) : ''}`; },
        label:c => ` ${c.dataset.label}: ${c.raw == null ? 'n/a' : N(Math.round(c.raw))} ${unit}`}}},
      scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:10}}, y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}}});
  // 0. since the call: day by day, bars before the call in gray, early (not final) days lighter
  if (b.since && $('#chSince')){
    const sd = b.since.days, ci = sd.d.indexOf(b.since.call), sm = S.sm, sunit = {c:'clicks', i:'views', nbc:'clicks without the brand name', nbi:'views without the brand name'}[sm];
    S.charts.since = new Chart($('#chSince'), {type:'bar', data:{labels:sd.d.map(dm), datasets:[{label:sunit, data:sd[sm],
        backgroundColor:sd.d.map((d, i) => i < ci ? cmp : d >= sd.fresh_from ? accent + '88' : accent), borderRadius:4, maxBarThickness:34}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, startMark:{index:ci - 0.5, label:`Our call, ${dm(b.since.call)}`, color:ink},
        tooltip:{callbacks:{title:c => { const d = sd.d[c[0].dataIndex]; return dm(d) + (d >= sd.fresh_from ? ' (early figure)' : ''); }, label:c => ` ${N(c.raw)} ${sunit}`}}},
        scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:12}}, y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}},
      plugins:[markerPlugin]});
  }
  // 0b. since the call: views by page type, visitor sources, articles per day
  if (b.since && $('#chTypes')){
    const s = b.since, col = bandColors(b), donut = (el, labels, data, unit) => new Chart(el, {type:'doughnut', data:{labels, datasets:[{data, backgroundColor:col.concat(['#D5DDE1', '#E9EEF0']), borderWidth:2, borderColor:'#fff'}]},
      options:{responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'right', labels:{boxWidth:10, boxHeight:10, font:{size:11.5}, generateLabels:ch => ch.data.labels.map((l, i) => ({text:`${l}  ${N(data[i])}`, fillStyle:ch.data.datasets[0].backgroundColor[i], strokeStyle:'#fff', index:i}))}},
        tooltip:{callbacks:{label:c => ` ${c.label}: ${N(c.raw)} ${unit}`}}}}});
    const ty = S.data.types.map((t, i) => [t, s.types[i][0][1]]).filter(x => x[1] > 0).sort((x, y) => y[1] - x[1]);
    S.charts.types = donut($('#chTypes'), ty.map(x => x[0]), ty.map(x => x[1]), 'views');
    if (s.clarity && $('#chSrc')){ const src = s.clarity.source.slice(0, 5), rest = s.clarity.source.slice(5).reduce((a, x) => a + x[1], 0); if (rest) src.push(['Other', rest]);
      S.charts.src = donut($('#chSrc'), src.map(x => x[0].replace('www.', '')), src.map(x => x[1]), 'visits'); }
    const pub = s.published, all = pub.live.map(x => [x.date.slice(0, 10), 0]).concat(pub.next.map(x => [x.date.slice(0, 10), 1])), days = [];
    if (all.length){ let a = dayNum(s.call), z = Math.max(...all.map(x => dayNum(x[0]))); for (let k = a; k <= z; k++) days.push(isoOf(k)); }
    S.charts.art = new Chart($('#chArt'), {type:'bar', data:{labels:days.map(dm), datasets:[

        {label:'Scheduled', data:days.map(d => all.filter(x => x[0] === d && x[1]).length), backgroundColor:accent + '44', borderRadius:3, maxBarThickness:22}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10, boxHeight:10, font:{size:11.5}}}},
        scales:{x:{stacked:true, grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:6, font:{size:10.5}}}, y:{stacked:true, beginAtZero:true, grid:{color:grid}, ticks:{precision:0, stepSize:1}}}}});
  }
  // 1b. Clarity visits per daily check
  if (b.clarity && b.clarity.length > 1 && $('#chClarity')){
    const rs = clarWindows(b).cur;
    S.charts.clarity = new Chart($('#chClarity'), {type:'bar', data:{labels:rs.map(r => r.days > 1 ? rng(r.from.slice(0, 10), r.to.slice(0, 10)) : dm(r.to.slice(0, 10))), datasets:[
        {label:'Visits by real people', data:rs.map(r => r.sessions), backgroundColor:accent, borderRadius:6, maxBarThickness:42}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{title:c => { const r = rs[c[0].dataIndex]; return r.days > 1 ? `${r.days} days to ${dm(r.to.slice(0, 10))}` : `24 hours to ${dm(r.to.slice(0, 10))}, 12:45 pm`; },
        label:c => { const r = rs[c.dataIndex]; return [` ${N(r.sessions)} visits`, ` ${r.scroll == null ? 'n/a' : Math.round(r.scroll) + '%'} scrolled on average`]; }}}},
        scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:10}}, y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}}});
  }
  // 2. traffic split
  const Lw = b.win[p.latest], Cw = b.win[p[role()]], k = S.tmx === 'c' ? 0 : 1, tl = S.tg === 'type' ? S.data.types : S.data.bands;
  S.charts.traffic = new Chart($('#chTraffic'), {type:'bar', data:{labels:tl, datasets:[
      {label:cmpName(b), data:(S.tg === 'type' ? Cw.tt : Cw.tb).map(x => x[k]), backgroundColor:cmp, borderRadius:6, maxBarThickness:42},
      {label:nowName(), data:(S.tg === 'type' ? Lw.tt : Lw.tb).map(x => x[k]), backgroundColor:accent, borderRadius:6, maxBarThickness:42}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend, tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${N(c.raw)} ${S.tmx === 'c' ? 'clicks' : 'views'}`}}},
      scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:false, font:{size:11}, callback:function(v){ const s = this.getLabelForValue(v); return s.length > 14 ? s.split(' ').reduce((acc, w) => { const l = acc[acc.length - 1]; if ((l + ' ' + w).trim().length > 14) acc.push(w); else acc[acc.length - 1] = (l + ' ' + w).trim(); return acc; }, ['']) : s; }}},
        y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}}});
  // 3. ranking bands
  const rb = S.rank === 'all' ? p.bands : p.bands_nb;
  S.charts.rank = new Chart($('#chRank'), {type:'bar', data:{labels:S.data.bands, datasets:[
      {label:cmpName(b), data:rb[role()], backgroundColor:cmp, borderRadius:6, maxBarThickness:42},
      {label:nowName(), data:rb.latest, backgroundColor:accent, borderRadius:6, maxBarThickness:42}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend, tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${N(c.raw)} searches`}}},
      scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:false, font:{size:11}}}, y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}}});
  // 4. backlinks over time, once there are two checks

      scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:8, callback:function(v){ const w = wk[v]; return w ? MON[P(w.from).m - 1] + ' ' + P(w.from).y : ''; }}},
        y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}},

}

// ---------- routing and events ----------
function route(){
  if (!S.data){ show('lock'); setTimeout(() => $('#pw').focus(), 50); return; }
  const id = location.hash.replace('#', '');
  if (S.data.brands.some(b => b.id === id)){ if (S.brand !== id){ S.kwq = ''; S.kwb = 'all'; S.kwall = false; } S.brand = id; renderDash(); }
  else { S.brand = null; renderChoose(); }
}
async function unlock(pw, silent){
  const btn = $('#unlockbtn'), err = $('#lockerr');
  btn.disabled = true; btn.textContent = 'Opening...'; err.textContent = '';
  try {
    S.data = await decrypt(pw); store.set('lnc_pw', pw);
    const sp = store.get('lnc_period'), sc = store.get('lnc_cmp');
    if (PIDS.includes(sp)) S.period = sp; if (sc === 'previous' || sc === 'start') S.cmp = sc;
    route();
  }
  catch (e) { store.del('lnc_pw'); if (!silent) err.textContent = e.message === 'password' ? 'That password did not work. Check it and try again.' : 'The data could not load. Check the connection and reload the page.'; show('lock'); }
  finally { btn.disabled = false; btn.textContent = 'Open dashboard'; }
}
$('#lockform').addEventListener('submit', e => { e.preventDefault(); const pw = $('#pw').value; if (pw.trim()) unlock(pw, false); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-cmp],[data-period],[data-rank],[data-tm],[data-tmx],[data-tg],[data-lm],[data-tq],[data-sm],[data-wl],[data-mb],[data-mm],[data-kv]');
  if (!t) return;
  const b = S.data && S.data.brands.find(x => x.id === S.brand);
  if (t.dataset.act === 'lock'){ store.del('lnc_pw'); S.data = null; $('#pw').value = ''; $('#choose').innerHTML = ''; $('#dash').innerHTML = ''; history.replaceState(null, '', location.pathname); route(); return; }
  if (!b) return;
  if (t.dataset.act === 'kwall'){ S.kwall = !S.kwall; renderKw(b); return; }
  if (t.dataset.act === 'jump'){ const el = document.getElementById(t.dataset.to); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if (t.dataset.act === 'kxmore'){ S.kn += 25; renderKwx(b); return; }
  if (t.dataset.kv){ S.kv = t.dataset.kv; S.kn = 15; document.querySelectorAll('[data-kv]').forEach(x => x.setAttribute('aria-pressed', x === t)); renderKwx(b); return; }
  if (t.dataset.mm){ S.mm = t.dataset.mm; document.querySelectorAll('[data-mm]').forEach(x => x.setAttribute('aria-pressed', x === t)); renderMonthly(b); return; }
  if (t.dataset.mb){ S.mb = t.dataset.mb; document.querySelectorAll('[data-mb]').forEach(x => x.setAttribute('aria-pressed', x === t)); renderMonths(b); return; }
  const y = window.scrollY;
  if (t.dataset.period){ S.period = t.dataset.period; store.set('lnc_period', S.period); }
  if (t.dataset.cmp){ S.cmp = t.dataset.cmp; store.set('lnc_cmp', S.cmp); }
  if (t.dataset.rank) S.rank = t.dataset.rank;
  if (t.dataset.tm) S.tm = t.dataset.tm;
  if (t.dataset.tmx) S.tmx = t.dataset.tmx;
  if (t.dataset.tg) S.tg = t.dataset.tg;
  if (t.dataset.lm) S.lm = t.dataset.lm;
  if (t.dataset.tq) S.tq = t.dataset.tq;
  if (t.dataset.sm) S.sm = t.dataset.sm;
  if (t.dataset.wl) S.wl = t.dataset.wl;
  if (t.dataset.period) S.kn = 15;
  renderDash(); window.scrollTo(0, y);
});
let kwTimer = null;
document.addEventListener('input', e => {
  const b = S.data && S.data.brands.find(x => x.id === S.brand); if (!b) return;
  if (e.target.id === 'kwq'){ clearTimeout(kwTimer); kwTimer = setTimeout(() => { S.kwq = e.target.value; renderKw(b); }, 120); }
});
document.addEventListener('change', e => {
  const b = S.data && S.data.brands.find(x => x.id === S.brand); if (!b) return;
  if (e.target.id === 'kwb'){ S.kwb = e.target.value; renderKw(b); }
  if (e.target.id === 'kws'){ S.kwsort = e.target.value; renderKw(b); }
  if (e.target.id === 'pf'){ S.pf = e.target.value; renderPlan(b); }
  if (e.target.id === 'psort'){ S.ps = e.target.value; renderPlan(b); }
});
window.addEventListener('hashchange', route);
let rsz = null, lastSm = innerWidth < 600;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { const b = S.data && S.data.brands.find(x => x.id === S.brand); if (b && (innerWidth < 600) !== lastSm){ lastSm = innerWidth < 600; renderMonthly(b); renderMonths(b); } }, 200); });
const saved = store.get('lnc_pw');
if (saved) unlock(saved, true); else route();
})();
</script>
